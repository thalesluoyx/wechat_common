[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat_common"
version = "0.1.0"
description = "Standardized Enterprise WeChat (WeCom) AI Bot and Notification Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wecom-aibot-sdk-python>=0.1.7",
    "websockets>=12.0",
    "aiohttp>=3.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
